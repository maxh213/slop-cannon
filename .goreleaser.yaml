# Release pipeline for `sc` (P10-03).
#
# Local dry run (no tags, no network publish):
#   GOBIN=$PWD/bin go install github.com/goreleaser/goreleaser/v2@v2.18.0
#   ./bin/goreleaser check
#   ./bin/goreleaser release --snapshot --clean --skip=publish
#   ./dist/sc_linux_amd64_v1/sc version
#
# A real release is cut by pushing a tag; .github/workflows/release.yml runs
# `goreleaser release --clean` for it. Nothing here talks to the network apart
# from `go mod download` and the GitHub upload at the very end.
version: 2

project_name: slop-cannon

before:
  hooks:
    # Everything else (fmt, lint, test, golden) is the CI gate in
    # .github/workflows/release.yml; keep the build hooks offline-cheap.
    - go mod download

builds:
  - id: sc
    main: ./cmd/sc
    binary: sc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Keep these three -X paths in sync with the Makefile's LDFLAGS and with
    # internal/cli/version.go (P1-10): renaming a variable breaks both.
    ldflags:
      - -s -w
      - -X slop-cannon/internal/cli.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X slop-cannon/internal/cli.Commit={{ .ShortCommit }}
      - -X slop-cannon/internal/cli.Date={{ .CommitDate }}
    # Reproducible builds: stamp archives and binaries with the commit time
    # rather than the wall clock, so re-running the release is byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sc
    ids:
      - sc
    formats:
      - tar.gz
    # install.sh builds this exact name; change both together.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: docs/*.md
        dst: docs
        info:
          mode: 0644

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  # This repository does not use conventional commits, so goreleaser's stock
  # feat:/fix: groups and ^docs:/^chore:/^claim filters were dead configuration
  # here: every subject is "<task ids>: <what changed>" (the Agent Protocol in
  # IMPLEMENTATION-PROGRESS.md), and none of the 48 commits written so far
  # matched a single one of those patterns, so the whole history landed under
  # one "Others" heading. What the history does have is bookkeeping commits
  # that only move the progress file: 19 of those same 48, worth dropping.
  # internal/cli/release_artifacts_test.go fails if a pattern below stops
  # matching real commits, so this cannot rot back into decoration.
  #
  # `use: git` keeps the notes identical between the documented offline dry run
  # and the real release; `use: github` needs the compare API. There is no
  # `sort`: goreleaser sorts by *message* when it is set, which ordered the
  # list alphabetically (P10-* above P2-*); unset keeps git's own order.
  # Grouping is left off deliberately - one commit closes a whole wave of
  # tasks, so there is nothing to group by; the grouped account is CHANGELOG.md.
  use: git
  abbrev: 7
  format: "{{ .SHA }} {{ .Message }}"
  filters:
    exclude:
      # Progress-file bookkeeping: "<ids>: record <wave>" and "<ids>: mark
      # <phase> done in IMPLEMENTATION-PROGRESS.md" change no shipped code.
      - ": record "
      - "IMPLEMENTATION-PROGRESS"
      # No merge commit exists yet; this keeps them out if that ever changes.
      - "^Merge "

release:
  # The repository has no origin remote yet, so owner/name cannot be inferred:
  # they come from the environment (the release workflow passes GitHub's own
  # GITHUB_REPOSITORY_OWNER / the repository name) with a default that keeps
  # `goreleaser check` and a local snapshot working on a remote-less clone.
  github:
    owner: '{{ envOrDefault "SC_REPO_OWNER" "maxh213" }}'
    name: '{{ envOrDefault "SC_REPO_NAME" "slop-cannon" }}'
  # The commit list goreleaser generates is raw history whose subjects are
  # task IDs; this says where the prose account is and how to read them.
  header: |
    [CHANGELOG.md](https://github.com/{{ envOrDefault "SC_REPO_OWNER" "maxh213" }}/{{ envOrDefault "SC_REPO_NAME" "slop-cannon" }}/blob/{{ .Tag }}/CHANGELOG.md)
    is the account of this release in prose.

    The commits below are the raw history. Almost every subject begins with
    the `P<phase>-<number>` task IDs that commit closes, from
    `IMPLEMENTATION-PROGRESS.md` in the repository, so a single commit often
    covers a whole wave of work.
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/{{ envOrDefault "SC_REPO_OWNER" "maxh213" }}/{{ envOrDefault "SC_REPO_NAME" "slop-cannon" }}/{{ .Tag }}/install.sh | sh
    ```

    The Go module path is `slop-cannon`, not a URL, so no module proxy can
    resolve it and `go install` cannot be used. To build from source, clone the
    repository at this tag instead:

    ```sh
    git clone https://github.com/{{ envOrDefault "SC_REPO_OWNER" "maxh213" }}/{{ envOrDefault "SC_REPO_NAME" "slop-cannon" }}.git
    cd {{ envOrDefault "SC_REPO_NAME" "slop-cannon" }} && git checkout {{ .Tag }}
    make install
    ```

# Homebrew tap. Uploading is off unless the release job sets
# HOMEBREW_TAP_SKIP_UPLOAD=false and provides a token with write access to
# {{ owner }}/homebrew-tap; the cask is still rendered into dist/ every run, so
# the formula template is testable without a tap.
homebrew_casks:
  - name: slop-cannon
    binaries:
      - sc
    ids:
      - sc
    repository:
      owner: '{{ envOrDefault "HOMEBREW_TAP_OWNER" "maxh213" }}'
      name: '{{ envOrDefault "HOMEBREW_TAP_REPO" "homebrew-tap" }}'
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ envOrDefault "HOMEBREW_TAP_SKIP_UPLOAD" "true" }}'
    homepage: 'https://github.com/{{ envOrDefault "SC_REPO_OWNER" "maxh213" }}/{{ envOrDefault "SC_REPO_NAME" "slop-cannon" }}'
    description: "Fire a cannon of coding agents at a repository and watch the feedback loop in your terminal"
    license: "MIT"
    commit_author:
      name: slop-cannon-releaser
      email: noreply@users.noreply.github.com
    # sc drives `bd` (beads) and `git`; `gh` is needed for safety-on runs.
    dependencies:
      - formula: git
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sc"]
          end

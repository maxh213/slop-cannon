name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        with:
          path: bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: make check
        run: make check
      - name: make check-golden
        run: make check-golden
      - name: make build
        run: make build && ./bin/sc version

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Detect bd
        id: bd
        run: |
          if command -v bd >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            bd version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "bd is not installed; skipping integration tests"
          fi
      - name: make integration
        if: steps.bd.outputs.available == 'true'
        run: make integration

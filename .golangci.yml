version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: increment-decrement
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
